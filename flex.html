<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 50px;
      }

      .container {
        background-color: rgb(254, 246, 246);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .item {
        border-radius: 8px;
        width: 200px;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item" style="background-color: darkgreen"></div>
      <div class="item" style="background-color: darkorange"></div>
      <div class="item" style="background-color: blueviolet"></div>
    </div>
  </body>
</html>
