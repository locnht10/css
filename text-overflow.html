<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Overflow</title>
    <style>
      input {
        width: 200px;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <input
      type="text"
      id="search"
      placeholder="Đây là một đoạn văn rất dài và sẽ bị tràn nếu không ẩn đi"
    />
  </body>
</html>
