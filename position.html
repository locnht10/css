<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position</title>
    <style>
      .parent {
        /* display: flex;
        flex-direction: column; */
        gap: 10px;
        margin: 50px;
        width: 400px;
        height: 500px;
        padding: 10px;
        border: 2px solid lightgray;
        border-radius: 10px;
        overflow: auto;
      }
      .box {
        width: 200px;
        height: 200px;
        color: white;
        border-radius: 12px;
        margin-bottom: 10px;
        font-weight: bold;
        font-size: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* .box-2 {
        position: relative;
        top: -20px;
        left: -20px;
      } */

      .box-1 {
        position: absolute;
        right: 50px;
        top: 50%;
      }

      .box-3 {
        position: sticky;
        top: 50px;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box box-1" style="background-color: cornflowerblue">
        Hộp 1
      </div>
      <div class="box box-2" style="background-color: blueviolet">Hộp 2</div>
      <div class="box box-3" style="background-color: teal">Hộp 3</div>
      <div class="box box-4" style="background-color: darkorange">Hộp 4</div>
      <div class="box box-5" style="background-color: hotpink">Hộp 5</div>
      <div class="box box-6" style="background-color: aquamarine">Hộp 6</div>
    </div>
  </body>
</html>
