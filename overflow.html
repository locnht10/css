<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overflow</title>
    <style>
      .container {
        width: 400px;
        height: 400px;
        border: 5px solid lightgray;
        padding: 5px;
        border-radius: 16px;
        /* overflow: auto; cuộn nội dung*/
        /* overflow: scroll; cuộn nội dung */
        /* overflow: hidden; ẩn đi nội dung bị tràn ra ngoài, nhưng nội dung này vẫn tồn tại */
        /* overflow-x: hidden;
        overflow-y: auto; */
        /* overflow: clip; cắt bỏ hoàn toàn nội dung bị tràn*/
        overflow: clip;
        overflow-clip-margin: 20px; /* cho phép nội dung tràn ra tối đa 20px, phần còn lại bị loại bỏ hoàn toàn */
      }
      .box {
        width: 200px;
        height: 200px;
        border-radius: 12px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Overflow</h1>
    <div class="container">
      <div class="box" style="background-color: gold"></div>
      <div class="box" style="background-color: darkorange"></div>
      <div class="box" style="background-color: hotpink"></div>
      <div class="box" style="background-color: cornflowerblue"></div>
      <div class="box" style="background-color: blueviolet"></div>
    </div>
  </body>
</html>
