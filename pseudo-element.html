<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo Element</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      h1 {
        margin: 20px;
        font-size: 36px;
        position: relative;
      }

      h1::before {
        content: "✅";
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Tiêu đề</h1>
    <h1>Tiêu đề</h1>
  </body>
</html>
