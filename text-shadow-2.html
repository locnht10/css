<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Shadow</title>
    <style>
      body {
        background-color: black;
        text-align: center;
        margin-top: 80px;
        font-family: Arial, Helvetica, sans-serif;
      }
      .neon-text {
        font-size: 60px;
        font-weight: bold;
        color: white;
        text-shadow:
          0 0 5px #ff1eff,
          0 0 15px #ff00ff,
          0 0 25px #e600e6,
          0 0 40px #9400d3,
          0 0 80px #4b0082,
          0 0 160px #2a0047,
          2px 2px 5px rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <h1 class="neon-text">Neon</h1>
  </body>
</html>
