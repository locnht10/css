<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotate</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 50px;
      }

      .container {
        display: flex;
        padding: 50px;
        justify-content: center;
        align-items: center;
      }

      .box {
        width: 300px;
        height: 300px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        background-color: royalblue;
        border-radius: 16px;
        transition: transform 0.5s ease-in-out;
        perspective: 1000px;
      }

      .box:hover {
        /* 
            deg: độ, 45deg = 45 độ
            turn: vòng quay, 1turn = 360 độ, 0.5turn = 180 độ
        */
        transform: rotate3D(1, 1, 1, 45deg);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Xoay Tui</div>
    </div>
  </body>
</html>
