<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      /* Container chứa Grid */
      .container {
        display: grid;
        /* width: 50%;
        height: 50%; */
        /* grid-template: repeat(2, 1fr) / 1fr 1fr 1fr; */
        /* grid-template: grid-template-rows / grid-template-columns */
        grid-template: repeat(2, 200px) / repeat(3, 200px);
        row-gap: 10px;
        column-gap: 20px;
        background-color: aquamarine;
        padding: 20px;
        border-radius: 12px;
      }

      /* Các ô trong Grid*/
      .item {
        background-color: white;
        border: 2px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        border-radius: 8px;
      }

      /* .item1 {
        grid-row-start: 1;
        grid-row-end: 3;
        grid-column-start: 1;
        grid-column-end: 3;
      } */

      .item1 {
        grid-row: 2 / span 2;
        grid-column: 2 / span 2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item item1">1</div>
      <div class="item item2">2</div>
      <div class="item item3">3</div>
      <div class="item item4">4</div>
      <div class="item item5">5</div>
      <div class="item item6">6</div>
    </div>
  </body>
</html>
