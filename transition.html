<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: black;
      }

      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 100px;
      }

      .button {
        background-color: #e11d48;
        width: 200px;
        border: none;
        font-size: 1.5rem;
        border-radius: 8px;
        color: white;
        padding: 12px 24px;
        transition: background-color 0.5s;
      }

      .button:hover {
        background-color: #9f1239;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button class="button">Nút bấm</button>
    </div>
  </body>
</html>
