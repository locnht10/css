<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fade In Down Animation</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 100px;
      }

      .box {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100px;
        height: 50px;
        font-size: 24px;
        font-weight: bold;
        padding: 20px 40px;
        background-color: #16a34a;
        border-radius: 10px;
        color: white;
        animation: fadeInDown 5s ease-in-out 2s both;
      }

      @keyframes fadeInDown {
        0% {
          opacity: 0;
          transform: translateY(-50px);
          color: red;
        }

        50% {
          transform: scale(1.2);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          color: blue;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">Loc</div>
  </body>
</html>
