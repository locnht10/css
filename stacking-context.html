<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stacking Context</title>
    <style>
      .container {
        position: relative;
        width: 500px;
        height: 500px;
        margin: 50px;
      }
      .box {
        width: 300px;
        height: 300px;
        position: absolute;
      }

      .box1 {
        background-color: blueviolet;
        top: 50px;
        left: 50px;
        z-index: 15;
      }

      .box2 {
        background-color: aqua;
        top: 0;
        left: 0;
        z-index: 10;
      }

      .box3 {
        background-color: darkorange;
        top: 100px;
        left: 100px;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box box1"></div>
      <div class="box box2"></div>
      <div class="box box3"></div>
    </div>
  </body>
</html>
