<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Justify</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
      }

      .container {
        background-color: hsl(156, 83%, 86%);
        width: 90vw;
        height: 80vh;
        border-radius: 16px;
        padding: 20px;
        display: flex;
        gap: 20px;
        /* justify-content: space-evenly; */
        align-items: center;
      }

      .item {
        border-radius: 8px;
        width: 100px;
        height: 100px;
      }

      /* .item1 {
        align-self: end;
      } */

      .item2 {
        order: -1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item item1" style="background-color: darkgreen"></div>
      <div class="item item2" style="background-color: darkorange"></div>
      <div class="item item3" style="background-color: blueviolet"></div>
    </div>
  </body>
</html>
